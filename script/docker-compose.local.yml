# Docker Compose Local - Backend Services with Hot Reload
# Tên container: docgo-local

services:
  # Kafka (KRaft mode) for local testing
  kafka:
    image: bitnami/kafka:3.7
    container_name: docgo-local-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Host access
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,INTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - docgo_network_local
  # Database - MariaDB (Infrastructure - No volume mounting)
  mariadb:
    image: mariadb:11.2
    container_name: docgo-local-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sapassword
      MYSQL_DATABASE: docgo
      MYSQL_USER: docgo_user
      MYSQL_PASSWORD: docgo_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data_local:/var/lib/mysql
      - ../database/init_user_db.sql:/docker-entrypoint-initdb.d/init_user_db.sql
      - ../backend/contract-management-service/database/init_contract_service.sql:/docker-entrypoint-initdb.d/init_contract_service.sql
    networks:
      - docgo_network_local

  # Redis for caching, session management and message broker
  redis:
    image: redis:7-alpine
    container_name: docgo-local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - docgo_network_local

  # Elasticsearch for search and indexing
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: docgo-local-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data_local:/usr/share/elasticsearch/data
    networks:
      - docgo_network_local

  # API Gateway BFF (Next.js) - Backend Service with Hot Reload
  api-gateway-bff:
    image: node:18-alpine
    container_name: docgo-local-api-gateway-bff
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ../backend/api-gateway-bff/.env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BROKERS=kafka:29092
      # Service URLs for all 19 microservices
      - API_GATEWAY_BFF_URL=http://localhost:8000
      - AUTHENTICATION_SERVICE_URL=http://authentication-identity-service:8001
      - USER_MANAGEMENT_SERVICE_URL=http://user-management-service:8002
      - CONTRACT_MANAGEMENT_SERVICE_URL=http://contract-management-service:8003
      - VERSIONING_DOCUMENT_HISTORY_SERVICE_URL=http://versioning-document-history-service:8004
      - COMMENTING_COLLABORATION_SERVICE_URL=http://commenting-collaboration-service:8005
      - APPROVAL_WORKFLOW_SERVICE_URL=http://approval-workflow-service:8006
      - REMINDER_SCHEDULER_SERVICE_URL=http://reminder-scheduler-service:8007
      - ESIGNATURE_INTEGRATION_SERVICE_URL=http://esignature-integration-service:8008
      - NOTIFICATION_SERVICE_URL=http://notification-service:8009
      - REPORTING_ANALYTICS_SERVICE_URL=http://reporting-analytics-service:8010
      - OCR_DOCUMENT_EXTRACTION_SERVICE_URL=http://ocr-document-extraction-service:8011
      - FILE_STORAGE_SERVICE_URL=http://file-storage-asset-service:8012
      - AUDIT_ACTIVITY_LOG_SERVICE_URL=http://audit-activity-log-service:8013
      - INTEGRATION_CONNECTORS_SERVICE_URL=http://integration-connectors-service:8014
      - BATCH_ETL_SERVICE_URL=http://batch-etl-service:8015
      - HEALTH_MONITORING_AGENT_URL=http://health-monitoring-agent:8016
      - AI_PROCESSING_SERVICE_URL=http://ai-processing-service:8017
      - GENERAL_FILE_MANAGEMENT_SERVICE_URL=http://general-file-management-service:8018
    volumes:
      - ../backend/api-gateway-bff:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # User Management Service (FastAPI) - Backend Service with Hot Reload
  user-management-service:
    image: python:3.11-slim
    container_name: docgo-local-user-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8002"
    env_file:
      - ../backend/user-management-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - PYTHONPATH=/app
      - DATABASE_HOST=mariadb
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../backend/user-management-service:/app
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # Authentication & Identity Service (Spring Boot) - Backend Service with Hot Reload
  authentication-identity-service:
    image: openjdk:21-jdk-slim
    container_name: docgo-local-authentication-identity-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8001:8001"
    env_file:
      - ../backend/authentication-identity-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8001
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/docgo
      - SPRING_DATASOURCE_USERNAME=docgo_user
      - SPRING_DATASOURCE_PASSWORD=docgo_password
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../backend/authentication-identity-service:/app
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8001'"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # File Storage Asset Service (FastAPI) - Backend Service with Hot Reload
  file-storage-asset-service:
    image: python:3.11-slim
    container_name: docgo-local-file-storage-asset-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8012:8012"
    env_file:
      - ../backend/file-storage-asset-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8012
      - PYTHONPATH=/app
      - DATABASE_HOST=mariadb
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../backend/file-storage-asset-service:/app
      - file_storage_uploads_local:/app/uploads
      - file_storage_temp_local:/app/temp
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8012 --reload"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # AI Processing Service (FastAPI) - Backend Service with Hot Reload
  ai-processing-service:
    image: python:3.11-slim
    container_name: docgo-local-ai-processing-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8017:8017"
    env_file:
      - ../backend/ai-processing-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8017
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../backend/ai-processing-service:/app
      - ai_processing_results_local:/app/results
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8017 --reload"
    depends_on:
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # Contract Management Service (Spring Boot) - Backend Service with Hot Reload
  contract-management-service:
    image: openjdk:17-jdk-slim
    container_name: docgo-local-contract-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8003:8003"
    env_file:
      - ../backend/contract-management-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/docgo_contract_service
      - SPRING_DATASOURCE_USERNAME=docgo_user
      - SPRING_DATASOURCE_PASSWORD=docgo_password
      - SERVER_PORT=8003
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    volumes:
      - ../backend/contract-management-service:/app
      - ../backend/contract-management-service/uploads:/app/uploads
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8003'"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

  # General File Management Service (FastAPI) - Backend Service with Hot Reload
  general-file-management-service:
    image: python:3.11-slim
    container_name: docgo-local-general-file-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8018:8018"
    env_file:
      - ../backend/general-file-management-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8018
      - PYTHONPATH=/app
      - DATABASE_HOST=mariadb
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ../backend/general-file-management-service:/app
      - general_file_management_uploads_local:/app/uploads
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8018 --reload"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_local

volumes:
  mariadb_data_local:
    driver: local
  redis_data_local:
    driver: local
  elasticsearch_data_local:
    driver: local
  ai_processing_results_local:
    driver: local
  file_storage_uploads_local:
    driver: local
  file_storage_temp_local:
    driver: local
  general_file_management_uploads_local:
    driver: local

networks:
  docgo_network_local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
