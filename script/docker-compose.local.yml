volumes:
  mariadb_data_local:
    driver: local
  mongodb_data_local:
    driver: local
  redis_data_local:
    driver: local
  elasticsearch_data_local:
    driver: local
  ai_processing_results_local:
    driver: local
  file_storage_uploads_local:
    driver: local
  file_storage_temp_local:
    driver: local
  general_file_management_uploads_local:
    driver: local

networks:
  docgo_network_local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
