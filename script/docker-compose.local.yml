    environment:
      - DATABASE_URL=mysql+pymysql://docgo_user:docgo_password@mariadb:3306/docgo
    volumes:
      - ../backend/versioning-document-history-service:/app
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8004 --reload"
