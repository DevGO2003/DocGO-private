  mariadb_data_dev:
    driver: local
  mongodb_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  elasticsearch_data_dev:
    driver: local
  ai_processing_results_dev:
    driver: local
  file_storage_uploads_dev:
    driver: local
  file_storage_temp_dev:
    driver: local
  general_file_management_uploads_dev:
    driver: local
  
  # Optimized dependency cache volumes for faster builds
  maven_cache_dev:
    driver: local
  npm_cache_dev:
    driver: local
  pip_cache_dev:
    driver: local
  node_modules_cache_dev:
    driver: local
  python_packages_dev:
    driver: local
  maven_repo_dev:
    driver: local

networks:
  docgo_network_dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
