# Docker Compose Development - Optimized for Hot Reload + Hybrid Approach
# Tên container: docgo-dev
# Tối ưu hóa: Code sync + Dependency cache + Hot reload

services:
  # Kafka (KRaft mode) for local testing
  kafka:
    image: bitnami/kafka:3.7
    container_name: docgo-dev-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Host access
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9094,INTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      # Increase message size limits for large file processing
      - KAFKA_CFG_MESSAGE_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=10485760  # 10MB
      - KAFKA_CFG_MAX_REQUEST_SIZE=10485760  # 10MB
    networks:
      - docgo_network_dev

  # Database - MariaDB (Infrastructure - No volume mounting)
  mariadb:
    image: mariadb:11.1
    container_name: docgo-dev-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sapassword
      MYSQL_DATABASE: docgo
      MYSQL_USER: docgo_user
      MYSQL_PASSWORD: docgo_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ../database/init_user_db.sql:/docker-entrypoint-initdb.d/init_user_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psapassword"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docgo_network_dev

  # MongoDB for Contract Management Service
  mongodb:
    image: mongo:7.0
    container_name: docgo-dev-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: sapassword
      MONGO_INITDB_DATABASE: docgo_contract_service
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - docgo_network_dev

  # Redis for caching, session management and message broker
  redis:
    image: redis:7-alpine
    container_name: docgo-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docgo_network_dev

  # Elasticsearch for search and indexing
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: docgo-dev-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data_dev:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - docgo_network_dev

  # API Gateway BFF (Next.js) - Optimized Hot Reload
  api-gateway-bff:
    image: node:18-alpine
    container_name: docgo-dev-api-gateway-bff
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ../backend/api-gateway-bff/env/.env.local
    volumes:
      # Hybrid: Code sync + Dependency cache
      - ../backend/api-gateway-bff:/app
      - /app/node_modules
      - npm_cache_dev:/root/.npm
      - node_modules_cache_dev:/app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "npm ci --prefer-offline --cache /root/.npm && npm run dev"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_dev

  # User Management Service (FastAPI) - Optimized Hot Reload
  user-management-service:
    image: python:3.11-slim
    container_name: docgo-dev-user-management-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8002"
    env_file:
      - ../backend/user-management-service/env/.env.local
    volumes:
      # Hybrid: Code sync + Dependency cache
      - ../backend/user-management-service:/app
      - pip_cache_dev:/root/.cache/pip
      - python_packages_dev:/usr/local/lib/python3.11/site-packages
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install --cache-dir /root/.cache/pip -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_dev

  # Authentication & Identity Service (Spring Boot) - Optimized Hot Reload
  authentication-identity-service:
    build:
      context: ../backend/authentication-identity-service
      dockerfile: Dockerfile
      target: builder
    container_name: docgo-dev-authentication-identity-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8001:8001"
    env_file:
      - ../backend/authentication-identity-service/env/.env.local
    volumes:
      # Hybrid: Code sync + Dependency cache
      - ../backend/authentication-identity-service:/app
      - maven_cache_dev:/root/.m2
      - maven_repo_dev:/app/target
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw -DskipTests clean spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8001 -Dspring.devtools.restart.enabled=true'"
    depends_on:
      - mariadb
      - redis
      - elasticsearch
    networks:
      - docgo_network_dev

