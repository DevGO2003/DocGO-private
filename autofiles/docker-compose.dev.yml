version: '3.8'

services:
  # Database - MariaDB
  mariadb:
    image: mariadb:11.2
    container_name: docgo_mariadb_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sapassword
      MYSQL_DATABASE: docgo
      MYSQL_USER: docgo_user
      MYSQL_PASSWORD: docgo_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ../database/init_user_db.sql:/docker-entrypoint-initdb.d/init_user_db.sql
      - ../backend/contract-management-service/database/init_contract_service.sql:/docker-entrypoint-initdb.d/init_contract_service.sql
    networks:
      - docgo_network_dev

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: docgo_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - docgo_network_dev

  # API Gateway BFF (Next.js) - Development Mode
  api-gateway-bff:
    image: node:18-alpine
    container_name: docgo_api_gateway_bff_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
    volumes:
      - ../backend/api-gateway-bff:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - mariadb
      - redis
    networks:
      - docgo_network_dev

  # Authentication Identity Service (Spring Boot) - Development Mode
  authentication-identity-service:
    image: openjdk:17-jdk-slim
    container_name: docgo_auth_service_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/docgo
      - SPRING_DATASOURCE_USERNAME=docgo_user
      - SPRING_DATASOURCE_PASSWORD=docgo_password
      - SERVER_PORT=8001
    volumes:
      - ../backend/authentication-identity-service:/app
    command: >
      sh -c "chmod +x ./mvnw && ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments='-Dserver.port=8001'"
    depends_on:
      - mariadb
      - redis
    networks:
      - docgo_network_dev

  # User Management Service (FastAPI) - Development Mode
  user-management-service:
    image: python:3.11-slim
    container_name: docgo_user_management_service_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=mysql+pymysql://docgo_user:docgo_password@mariadb:3306/docgo_user_management_service
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - DATABASE_NAME=docgo_user_management_service
      - DATABASE_USER=docgo_user
      - DATABASE_PASSWORD=docgo_password
      - HOST=0.0.0.0
      - PORT=8002
      - PYTHONPATH=/app
    volumes:
      - ../backend/user-management-service:/app
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    depends_on:
      - mariadb
      - redis
    networks:
      - docgo_network_dev

  # Contract Management Service (Spring Boot) - Development Mode
  contract-management-service:
    image: docgo-contract-service:latest
    container_name: docgo_contract_service_dev
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/docgo
      - SPRING_DATASOURCE_USERNAME=docgo_user
      - SPRING_DATASOURCE_PASSWORD=docgo_password
      - SERVER_PORT=8003
    depends_on:
      - mariadb
      - redis
    networks:
      - docgo_network_dev

  # AI Processing Service (FastAPI) - Development Mode
  ai-processing-service:
    image: python:3.11-slim
    container_name: docgo_ai_processing_service_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8017:8017"
    environment:
      - HOST=0.0.0.0
      - PORT=8017
      - PYTHONPATH=/app
    volumes:
      - ../backend/ai-processing-service:/app
      - ai_processing_results_dev:/app/results
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8017 --reload"
    networks:
      - docgo_network_dev

  # File Storage Asset Service (FastAPI) - Development Mode
  file-storage-asset-service:
    image: python:3.11-slim
    container_name: docgo_file_storage_service_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8012:8012"
    environment:
      - HOST=0.0.0.0
      - PORT=8012
      - PYTHONPATH=/app
    volumes:
      - ../backend/file-storage-asset-service:/app
      - file_storage_uploads_dev:/app/uploads
      - file_storage_temp_dev:/app/temp
    command: >
      sh -c "pip install -r requirements.txt && python -m uvicorn main:app --host 0.0.0.0 --port 8012 --reload"
    networks:
      - docgo_network_dev

  # Frontend Web (Vite + React) - Development Mode
  frontend-web:
    image: node:18-alpine
    container_name: docgo_frontend_web_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ../frontend/web:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api-gateway-bff
    networks:
      - docgo_network_dev

volumes:
  mariadb_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  ai_processing_results_dev:
    driver: local
  file_storage_uploads_dev:
    driver: local
  file_storage_temp_dev:
    driver: local

networks:
  docgo_network_dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
