<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2563eb; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #dcfce7; border: 1px solid #86efac; }
        .error { background: #fee2e2; border: 1px solid #fca5a5; }
        .loading { color: #2563eb; }
    </style>
</head>
<body>
    <h1>🚀 Test Upload File</h1>
    
    <div class="form-group">
        <label>Repository ID:</label>
        <input type="text" id="repoId" placeholder="Nhập repository ID" value="">
    </div>
    
    <div class="form-group">
        <label>Chọn File:</label>
        <input type="file" id="fileInput">
    </div>
    
    <button id="uploadBtn" onclick="uploadFile()">Upload File</button>
    
    <div id="result"></div>
    
    <script>
        async function uploadFile() {
            const repoId = document.getElementById('repoId').value;
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('result');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!repoId) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '❌ Vui lòng nhập Repository ID!';
                return;
            }
            
            if (!fileInput.files || !fileInput.files[0]) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '❌ Vui lòng chọn file!';
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('repository_id', repoId);
            
            resultDiv.className = 'loading';
            resultDiv.innerHTML = '⏳ Đang upload... (timeout 100s)';
            uploadBtn.disabled = true;
            
            try {
                const response = await fetch('http://localhost:8000/api/v1/automation-service/files', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.statusCode === 201) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>✅ Upload thành công!</h3>
                        <p><strong>File ID:</strong> ${data.data.fileId}</p>
                        <p><strong>File URL:</strong> ${data.data.fileUrl}</p>
                        <p><strong>Repository ID:</strong> ${data.data.repositoryId || repoId}</p>
                        <p><strong>Correlation ID:</strong> ${data.data.correlationId}</p>
                    `;
                } else {
                    throw new Error(data.description || data.shortMessage || 'Upload failed');
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Upload thất bại!</h3>
                    <p>${error.message}</p>
                `;
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
