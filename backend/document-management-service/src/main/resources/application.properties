# Docker Environment Configuration for Contract Management Service

# Server
server.port=8002

# Spring Configuration
# FIXME: Bean definition override issue - corsConfigurationSource conflict between WebConfig and SecurityConfig
# This setting should allow overriding but still failing. Need to investigate further.
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration for Docker
spring.data.mongodb.uri=${MONGODB_ATLAS_URI:mongodb://localhost:27017/docgo_contract}
spring.data.mongodb.database=${MONGODB_DOCUMENT_DATABASE:docgo_contract}

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.document_service=DEBUG

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.use-root-path=false
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=/app/uploads

# Kafka Configuration for Docker - DISABLED
spring.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
