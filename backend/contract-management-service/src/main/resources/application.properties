# Server
server.port=8003

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/docgo_contract_service
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=uploads

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=contract-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.devgo2003.docgo.contract_service.model

# Kafka Topics
app.kafka.topic.contract-processing=contract-processing-requests
app.kafka.topic.callback=contract-processing-results

# Kafka Event Topics
app.kafka.topic.file-events=file.events
app.kafka.topic.ai-events=ai.events
app.kafka.topic.contract-events=contract.events
kafka.ai-events-topic=ai.events
kafka.contract-events-topic=contract.events
kafka.client-id=contract-management-service