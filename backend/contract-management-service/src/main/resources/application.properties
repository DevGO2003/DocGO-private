# Server
server.port=8003

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_ATLAS_URI:mongodb+srv://root:sapassword@devgo-docgo-cluster0.hsudzga.mongodb.net/docgo_contract_service?retryWrites=true&w=majority&appName=devgo-docgo-cluster0}
spring.data.mongodb.database=${MONGODB_DATABASE:docgo_contract_service}
spring.data.mongodb.auto-index-creation=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs

# External Service URLs
ai.service.url=${AI_SERVICE_URL:http://ai-processing-service:8003}
file.service.url=${FILE_SERVICE_URL:http://file-storage-asset-service:8018}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}
app.upload.directory=uploads

# Redis Cloud Configuration
spring.redis.enabled=true
spring.redis.host=${REDIS_CLOUD_HOST:redis}
spring.redis.port=${REDIS_CLOUD_PORT:6379}
spring.redis.password=${REDIS_CLOUD_PASSWORD:}
spring.redis.database=${REDIS_DB:0}
spring.redis.timeout=${REDIS_TIMEOUT:2000}ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Redis Topics
app.redis.topic.contract-summary-updated=contract.summary.updated
app.redis.topic.contract-updated=contract.updated
app.redis.topic.approval-created=approval.created
app.redis.topic.version-created=version.created
app.redis.topic.comment-created=comment.created
app.redis.topic.esignature-created=esignature.created
app.redis.topic.reminder-created=reminder.created
app.redis.topic.audit-log-created=audit.log.created
