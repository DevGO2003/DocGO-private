# Docker Environment Configuration for Contract Management Service

# Server
server.port=8003

# MongoDB Configuration for Docker
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/docgo_contract_service}
spring.data.mongodb.database=docgo_contract_service

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.contract_service=DEBUG

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.document-title=Contract Management Service API
springdoc.swagger-ui.page-title=DocGO - Contract Management Service

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.directory=/app/uploads

# Kafka Configuration (optional in Docker)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=contract-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.devgo2003.docgo.contract_service.model

# Kafka Topics
app.kafka.topic.contract-processing=contract-processing-requests
app.kafka.topic.callback=contract-processing-results

# Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
