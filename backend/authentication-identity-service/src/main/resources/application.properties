spring.application.name=auth-service
# Server
server.port=8001

# Database Configuration (Docker)
spring.datasource.url=jdbc:mariadb://mariadb:3306/docgo
spring.datasource.username=docgo_user
spring.datasource.password=docgo_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.devgo2003.docgo.auth_service=DEBUG

# Swagger/OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

# Redirect configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# JWT Configuration (override via env in Docker)
security.jwt.base64-secret=VGhpcy1pcy1hLXN1cGVyLWxvbmcgc2VjcmV0LXBsZWFzZS1vdmVycmlkZS1pbi1lbmYu
security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=1209600

# Redis (optional)
spring.data.redis.host=redis
spring.data.redis.port=6379
auth.blacklist.provider=redis # values: redis|memory

# OAuth2 Client (example: Google) - set via environment in Docker
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=id