# Repository Management Service Configuration

# Server Configuration
server.port=8002
server.servlet.context-path=/

# Spring Boot Configuration
spring.application.name=repository-management-service
spring.profiles.active=dev

# MongoDB Configuration
spring.data.mongodb.uri=mongodb+srv://thaigo2003:thaigo2003@cluster0.8xqjq.mongodb.net/docgo?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.database=docgo

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=repository-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics - FILE EVENTS (matching automation-service)
app.kafka.topic.file-metadata-recorded=file.metadata.recorded
app.kafka.topic.file-plaintext-extracted=file.plaintext.extracted
app.kafka.topic.contract-summary-generated=contract.summary.generated

# Logging Configuration
logging.level.com.devgo2003.docgo=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=WARN

# Swagger Configuration
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.document-title=Repository Management Service API
springdoc.swagger-ui.page-title=DocGO - Repository Management Service
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# Security Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*