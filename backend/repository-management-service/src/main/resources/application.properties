# Repository Management Service Configuration

# Server Configuration
server.port=8002
server.servlet.context-path=/

# Spring Boot Configuration
spring.application.name=repository-management-service
spring.profiles.active=dev

# MVC Configuration
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# MongoDB Configuration (Atlas only - no local fallback)
# Use environment variable MONGODB_ATLAS_URI and do NOT default to localhost
# Example (in .env): MONGODB_ATLAS_URI=mongodb+srv://user:pass@cluster.mongodb.net/docgo?retryWrites=true&w=majority&appName=Cluster0
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:docgo}

# Kafka Configuration - Enhanced for detailed flow
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=docgo-repo-events-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topics - UNIFIED FILE EVENTS (single topic)
app.kafka.topic.docgo-file-events=docgo-file-events

# Logging Configuration
logging.level.com.devgo2003.docgo=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.springframework.boot=WARN

# Logging file configuration
logging.file.name=p:/DevGO2003/DocGO-private-new/.windsurf/logs/repository-management-service.log
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{20} - %msg%n
logging.pattern.file=%d{HH:mm:ss} [%-5level] %logger{20} - %msg%n
logging.exception-conversion-word=%wEx{1}

# Swagger Configuration
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.document-title=Repository Management Service API
springdoc.swagger-ui.page-title=DocGO - Repository Management Service
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# Security Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# User Management Service Configuration
user.management.service.url=${USER_MANAGEMENT_SERVICE_URL:http://user-management-service:8001}