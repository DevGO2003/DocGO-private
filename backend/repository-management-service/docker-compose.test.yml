services:
  mongodb:
    image: mongo:7.0
    container_name: docgo-mongodb-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: docgo
    volumes:
      - mongodb_data:/data/db
    networks:
      - docgo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  repository-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docgo-repository-service-test
    ports:
      - "8012:8002"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/docgo
      SPRING_DATA_MONGODB_DATABASE: docgo
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8002
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - docgo-network
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml

networks:
  docgo-network:
    driver: bridge

volumes:
  mongodb_data:
