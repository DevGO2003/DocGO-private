
name: DocGO

services:
  # ==========================================
  # INFRASTRUCTURE SERVICES
  # ==========================================

  # Kafka Broker
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.4.0
    
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/tmp/kafka-logs
    networks:
      - docgo-network
    restart: unless-stopped

  # Zookeeper (Alternative to KRaft mode)
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - docgo-network
    restart: unless-stopped

  # Kafka UI (Optional - for monitoring)
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - docgo-network
    restart: unless-stopped

  # Redis (Cache and session storage)
  redis:
    container_name: redis
    image: redis:7-alpine
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - docgo-network
    command: redis-server --appendonly yes
    restart: unless-stopped

  # MongoDB (Document database for repository service)
  mongodb:
    container_name: mongodb
    image: mongo:7-jammy
    
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-docgo}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - docgo-network
    restart: unless-stopped


  # ==========================================
  # MICROSERVICES
  # ==========================================

  # User Management Service (Spring Boot)
  user-management-service:
    container_name: user-management-service
    build:
      context: ./backend/user-management-service
      dockerfile: Dockerfile
    
    ports:
      - "${USER_MANAGEMENT_PORT:-8001}:8001"
    env_file:
      - .env
      - ./backend/user-management-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ENVIRONMENT=docker
    depends_on:
      - kafka
      - redis
    networks:
      - docgo-network
    volumes:
      - ./backend/user-management-service:/app  # Volume mount cho hot reload
      - maven-repo:/root/.m2  # Maven cache volume để tăng tốc build
      - ./logs/user-management:/app/logs
    restart: unless-stopped

  # Repository Management Service (Spring Boot) - formerly file-management-service
  repository-management-service:
    container_name: repository-management-service
    build:
      context: ./backend/repository-management-service
      dockerfile: Dockerfile

    ports:
      - "${REPOSITORY_MANAGEMENT_PORT:-8002}:8002"
    env_file:
      - .env
      - ./backend/repository-management-service/.env
    environment:
      - ENVIRONMENT=docker
    depends_on:
      - kafka
      - redis
      - mongodb
    networks:
      - docgo-network
    volumes:
      - ./backend/repository-management-service:/app  # Volume mount cho hot reload
      - maven-repo:/root/.m2  # Maven cache volume để tăng tốc build
      - ./backend/repository-management-service/uploads:/app/uploads
      - ./logs/repository-management:/app/logs
    restart: unless-stopped

  # Automation Service (FastAPI)
  automation-service:
    container_name: automation-service
    image: docgo-automation-service
    
    ports:
      - "${AUTOMATION_PORT:-8003}:8003"
    env_file:
      - .env
      - ./backend/automation-service/.env
    environment:
      - ENVIRONMENT=development
      - KAFKA_ENABLED=true
      - KAFKA_WORKER_ENABLED=false
      - ALLOW_LEGACY_WORKER=false
    depends_on:
      - kafka
      - redis
    networks:
      - docgo-network
    volumes:
      - ./backend/automation-service:/app  # Volume mount cho hot reload
      - ./backend/automation-service/uploads:/app/uploads
      - ./backend/automation-service/results:/app/results
      - ./logs/automation:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload  # Watch mode
    restart: unless-stopped

  # API Gateway (Next.js)
  api-gateway:
    container_name: api-gateway
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    env_file:
      - .env
      - ./backend/api-gateway/.env
    environment:
      - ENVIRONMENT=docker
    depends_on:
      - kafka
      - redis
      # - user-management-service  # TEMPORARILY DISABLED
      - repository-management-service
      - automation-service
    networks:
      - docgo-network
    volumes:
      - ./backend/api-gateway:/app  # Volume mount cho hot reload
      - /app/node_modules  # Exclude node_modules từ mount
      - /app/.next  # Exclude .next build folder
      - ./logs/api-gateway:/app/logs
    restart: unless-stopped

  # ==========================================
  # FRONTEND
  # ==========================================

  # Web App Frontend (Next.js)
  web-app:
    container_name: web-app
    build:
      context: ./frontend/web-app  # Giới hạn context chỉ thư mục này (tránh scan toàn project)
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Map port local
    volumes:
      - ./frontend/web-app:/app  # Mount code host vào container (hot reload key!)
      - /app/node_modules  # Anonymous volume: Giữ node_modules trong container, tránh conflict với host
    environment:
      - NODE_ENV=development  # Dev mode cho hot reload
      - CHOKIDAR_USEPOLLING=true  # Windows: Force polling thay vì fs events (fix sync chậm trên shared drive)
      - WATCHPACK_POLLING=true  # Fix Watchpack errors (EIO i/o) trong logs
      - NEXT_PUBLIC_API_GATEWAY_URL=http://api-gateway:8000  # Override để kết nối trong Docker network
      - NEXT_PUBLIC_API_BASE_URL=http://api-gateway:8000  # Override để kết nối trong Docker network
    stdin_open: true  # Cho phép attach console nếu cần
    tty: true  # TTY cho dev
    depends_on:
      - api-gateway  # Nếu cần backend
    networks:
      - docgo-network
    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================
volumes:
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  maven-repo:
    driver: local

# ==========================================
# NETWORKS
# ==========================================
networks:
  docgo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16



